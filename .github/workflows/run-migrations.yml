name: Run Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'migrate' to confirm you want to run migrations"
        required: true
        type: string
      dry_run:
        description: "Print migration plan without applying (alembic upgrade head --sql)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-wealthspot-prod
  CONTAINER_APP_NAME: wealthspot-api
  KV_NAME: wealthspot-kv-prod

jobs:
  migrate:
    name: Alembic Upgrade Head
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation input
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "migrate" ]]; then
            echo "Confirmation input must be exactly 'migrate'. Got: '${{ github.event.inputs.confirm }}'"
            exit 1
          fi
          echo "Confirmation accepted. Proceeding with migration."

      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get DATABASE_URL from Key Vault
        id: dburl
        run: |
          DB_URL=$(az keyvault secret show \
            --vault-name "${{ env.KV_NAME }}" \
            --name "database-url" \
            --query "value" -o tsv)
          echo "db_url=$DB_URL" >> "$GITHUB_OUTPUT"
          echo "DATABASE_URL retrieved from Key Vault."

      - name: Install migration dependencies
        working-directory: services/api
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet \
            "alembic>=1.18.0" \
            "sqlalchemy[asyncio]>=2.0.48" \
            "asyncpg>=0.29.0" \
            "pydantic>=2.10.0,<3.0.0" \
            "pydantic-settings>=2.7.0" \
            "python-jose[cryptography]>=3.3.0" \
            "passlib[bcrypt]>=1.7.4" \
            "itsdangerous>=2.1.0" \
            "httpx>=0.28.0" \
            "boto3>=1.42.0" \
            "redis>=5.1.0" \
            "celery>=5.6.0" \
            "sentry-sdk>=2.5.0" \
            "stripe>=14.0.0" \
            "razorpay>=2.0.0"
          echo "Dependencies installed."

      - name: Preflight replay readiness checks
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.db_url }}
        run: |
          python scripts/run_db_replay_check.py --database-url "$DATABASE_URL"

      - name: Run migrations (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: services/api
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.db_url }}
          APP_ENV: development
        run: |
          echo "=== DRY RUN: Printing migration SQL ==="
          alembic upgrade head --sql

      - name: Run migrations
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: services/api
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.db_url }}
          APP_ENV: development
        run: |
          echo "=== Running alembic upgrade head ==="
          alembic upgrade head
          echo "=== Migrations complete ==="

      - name: Post migration summary
        if: success()
        run: |
          echo "## Migration Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry Run | ${{ github.event.inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Timestamp | $(date -u) |" >> "$GITHUB_STEP_SUMMARY"

