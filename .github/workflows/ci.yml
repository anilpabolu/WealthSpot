name: CI

"on":
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend Lint & Type-Check ──────────────────────────
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check app/
      - run: ruff format --check app/

  # ── Backend Tests ──────────────────────────────────────
  # Installs services/api package + tests/api test deps, runs pytest
  # from tests/api/ using the CI postgres/redis services.
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: wealthspot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/wealthspot_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: testing
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      PYTHONPATH: ${{ github.workspace }}/services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/pyproject.toml
            tests/api/pyproject.toml
      - name: Install API package
        run: pip install -e "services/api"
      - name: Install test dependencies
        working-directory: tests/api
        run: pip install ".[dev]"
      - name: Run pytest
        working-directory: tests/api
        run: pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: tests/api/coverage.xml

  # ── Backend Docker Build ───────────────────────────────
  backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production -t wealthspot-api:ci services/api/

  # ── Frontend Lint & Type-Check ─────────────────────────
  # Uses ROOT package-lock.json (monorepo — no per-workspace lockfiles).
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run build:packages
      - name: TypeScript typecheck (web)
        working-directory: apps/web
        run: npx tsc --noEmit

  # ── Frontend Build ─────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    outputs:
      dist_path: apps/web/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run build:packages
      - name: Build web app
        working-directory: apps/web
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.wealthspot.in/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-ci
          path: apps/web/dist
          retention-days: 1

  # ── Frontend Tests ─────────────────────────────────────
  # Tests live in tests/web/src — NOT in apps/web.
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run build:packages
      - name: Run web unit tests
        run: npm run test:web --workspace=tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: tests/web/coverage/

  # ── Frontend BFF Functional Tests ──────────────────────
  frontend-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run build:packages
      - run: npm run test:web:functional --workspace=tests

  # ── Mobile Lint & Type-Check ──────────────────────────
  mobile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: TypeScript typecheck (mobile)
        working-directory: apps/mobile
        run: npx tsc --noEmit

  # ── Mobile Tests ───────────────────────────────────────
  # Tests live in tests/mobile/src — NOT in apps/mobile.
  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run test:mobile --workspace=tests

  # ── Mobile Bundle Smoke ────────────────────────────────
  # Confirms the Metro bundler + Expo config still produce a JS bundle.
  mobile-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Export JS bundle (no native build)
        working-directory: apps/mobile
        run: npx expo export --platform all --output-dir ./.expo-export
        env:
          EXPO_PUBLIC_API_URL: https://staging-api.wealthspot.in/api/v1

  # ── Dependency Audit ───────────────────────────────────
  # Surface high+critical advisories; continue-on-error keeps CI green
  # while advisories are being triaged.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm audit (high+critical)
        run: npm audit --audit-level=high --workspaces --include-workspace-root
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (Python)
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install ".[dev]"
          pip-audit --strict

  # ── E2E Playwright Tests ───────────────────────────────
  # Downloads web dist from frontend-build, serves with vite preview,
  # then runs Playwright specs from tests/web/e2e/.
  e2e-test:
    runs-on: ubuntu-latest
    needs: [frontend-build]
    continue-on-error: true  # Non-blocking until Clerk prod is configured
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run build:packages
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist-ci
          path: apps/web/dist
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Serve dist and run E2E tests
        run: |
          cd apps/web && npx vite preview --port 5173 &
          sleep 4
          npm run test:web:e2e --workspace=tests
        env:
          E2E_BASE_URL: http://localhost:5173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/web/playwright-report/

  # ── Security: Docker Image Scan ────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    needs: backend-docker
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production -t wealthspot-api:scan services/api/
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: wealthspot-api:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
