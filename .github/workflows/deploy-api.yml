name: Deploy API to Azure Container Apps

on:
  push:
    branches: [master]
    paths:
      - "services/api/**"
      - "deployment/azure/**"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy even without code changes"
        type: boolean
        default: false

concurrency:
  group: deploy-api
  cancel-in-progress: false  # Never cancel an in-flight API deployment

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read

env:
  RESOURCE_GROUP: rg-wealthspot-prod
  ACR_LOGIN_SERVER: wealthspotcrprod.azurecr.io
  CONTAINER_APP_NAME: wealthspot-api

jobs:
  # ── Build and push image to ACR ──────────────────────────────────────────────
  build:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE_TAG="${SHORT_SHA}-$(date +%Y%m%d%H%M)"
          FULL_IMAGE="$ACR_LOGIN_SERVER/wealthspot-api:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${FULL_IMAGE}"

      - name: Log in to ACR
        run: az acr login --name wealthspotcrprod

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/api
          file: services/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ env.ACR_LOGIN_SERVER }}/wealthspot-api:latest

  # ── Deploy new revision to Container Apps ────────────────────────────────────
  deploy:
    name: Deploy to Container Apps
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure ACR registry on Container App
        run: |
          IDENTITY_ID=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "identity.userAssignedIdentities | keys(@) | [0]" \
            --output tsv)
          az containerapp registry set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --server "$ACR_LOGIN_SERVER" \
            --identity "$IDENTITY_ID"

      - name: Update Container App with new image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.full_image }}" \
            --output none
          echo "Updated Container App to: ${{ needs.build.outputs.full_image }}"

      - name: Wait for new revision to be active
        run: |
          echo "Waiting up to 8 minutes for revision rollout..."
          API_FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          for i in $(seq 1 48); do
            sleep 10
            RUNNING=$(az containerapp revision list \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "[?properties.active && properties.runningState=='Running'] | length(@)" \
              -o tsv 2>/dev/null || echo "0")
            echo "Attempt $i/48 — Active running revisions: $RUNNING"
            if [[ "$RUNNING" -ge 1 ]]; then
              echo "Container App revision is Running!"
              exit 0
            fi
            # Also accept Degraded state if /live responds (readiness probe may lag)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://${API_FQDN}/live" 2>/dev/null || echo "000")
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Container is live (/live → 200). Accepting Degraded state."
              exit 0
            fi
          done
          echo "Timed out waiting for running revision. Fetching revision status for debugging..."
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[].{name:name,active:properties.active,state:properties.runningState,health:properties.healthState}" \
            --output table || true
          exit 1

      - name: Smoke test liveness endpoint
        run: |
          API_FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "API FQDN: $API_FQDN"
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://${API_FQDN}/live" || echo "000")
            echo "Attempt $i: /live → $HTTP_CODE"
            [[ "$HTTP_CODE" == "200" ]] && { echo "Liveness OK"; exit 0; }
            sleep 10
          done
          echo "Liveness probe failed after 5 attempts"
          exit 1

      - name: Annotate deployment in Application Insights
        if: success()
        run: |
          az monitor app-insights component annotation create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --app "ai-wealthspot-prod" \
            --release-name "api-${{ needs.build.outputs.image_tag }}" \
            --category Deployment \
            --custom-data "{\"commit\":\"${{ github.sha }}\",\"author\":\"${{ github.actor }}\"}" \
            --output none 2>/dev/null || true  # Non-fatal if AI not yet configured
