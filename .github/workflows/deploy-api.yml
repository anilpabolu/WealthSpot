name: Deploy API to Azure Container Apps

on:
  push:
    branches: [master]
    paths:
      - "services/api/**"
      - "deployment/azure/**"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy even without code changes"
        type: boolean
        default: false

concurrency:
  group: deploy-api
  cancel-in-progress: false  # Never cancel an in-flight API deployment

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read

env:
  RESOURCE_GROUP: rg-wealthspot-prod
  ACR_LOGIN_SERVER: wealthspotcrprod.azurecr.io
  CONTAINER_APP_NAME: wealthspot-api

jobs:
  # ── Build and push image to ACR ──────────────────────────────────────────────
  build:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE_TAG="${SHORT_SHA}-$(date +%Y%m%d%H%M)"
          FULL_IMAGE="$ACR_LOGIN_SERVER/wealthspot-api:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${FULL_IMAGE}"

      # az acr build sends the Dockerfile + context to ACR's cloud builder — no local Docker daemon needed
      - name: Build and push via ACR Tasks
        run: |
          az acr build \
            --registry "$ACR_LOGIN_SERVER" \
            --image "wealthspot-api:${{ steps.meta.outputs.image_tag }}" \
            --image "wealthspot-api:latest" \
            --file services/api/Dockerfile \
            --platform linux/amd64 \
            services/api/

  # ── Deploy new revision to Container Apps ────────────────────────────────────
  deploy:
    name: Deploy to Container Apps
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App with new image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.full_image }}" \
            --output none
          echo "Updated Container App to: ${{ needs.build.outputs.full_image }}"

      - name: Wait for new revision to be active
        run: |
          echo "Waiting 30s for revision rollout..."
          sleep 30
          # Check that at least one replica is running
          RUNNING=$(az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[?properties.active && properties.runningState=='Running'] | length(@)" \
            -o tsv)
          echo "Active running revisions: $RUNNING"
          [[ "$RUNNING" -ge 1 ]] || { echo "No running revisions found!"; exit 1; }

      - name: Smoke test liveness endpoint
        run: |
          API_FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "API FQDN: $API_FQDN"
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://${API_FQDN}/live" || echo "000")
            echo "Attempt $i: /live → $HTTP_CODE"
            [[ "$HTTP_CODE" == "200" ]] && { echo "Liveness OK"; exit 0; }
            sleep 10
          done
          echo "Liveness probe failed after 5 attempts"
          exit 1

      - name: Annotate deployment in Application Insights
        if: success()
        run: |
          az monitor app-insights component annotation create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --app "ai-wealthspot-prod" \
            --release-name "api-${{ needs.build.outputs.image_tag }}" \
            --category Deployment \
            --custom-data "{\"commit\":\"${{ github.sha }}\",\"author\":\"${{ github.actor }}\"}" \
            --output none 2>/dev/null || true  # Non-fatal if AI not yet configured
