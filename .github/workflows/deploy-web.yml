name: Deploy Web to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "packages/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [production, preview]
        default: production

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true  # Cancel stale web deploys — Cloudflare Pages handles atomically

permissions:
  contents: read

env:
  VITE_API_URL: https://api.wealthspot.in
  CF_PAGES_PROJECT_NAME: wealthspot-web

jobs:
  # ── Build Vite SPA ─────────────────────────────────────────────────────────
  build:
    name: Build Web App
    runs-on: ubuntu-latest
    outputs:
      dist_path: apps/web/dist

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build shared packages
        run: npm run build:packages

      - name: Build web app
        working-directory: apps/web
        env:
          # These are build-time injected into the Vite bundle
          VITE_API_URL: https://api.wealthspot.in
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          NODE_ENV: production
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  # ── Deploy to Cloudflare Pages ─────────────────────────────────────────────
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: wealthspot-web
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          # wranglerVersion pinned to avoid breakage from upstream changes
          wranglerVersion: "3"
