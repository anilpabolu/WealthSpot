name: Debug ACA Revisions
on: [workflow_dispatch]
permissions:
  id-token: write
  contents: read
env:
  RESOURCE_GROUP: rg-wealthspot-prod
  CONTAINER_APP_NAME: wealthspot-api
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Show Revision Errors
        run: |
          REVISION_NAME="wealthspot-api--0000043"
          echo "Console Logs for $REVISION_NAME:"
          az containerapp logs show -n $CONTAINER_APP_NAME -g $RESOURCE_GROUP --revision "$REVISION_NAME" --type console --tail 100 || true
          echo "System Logs for $REVISION_NAME:"
          az containerapp logs show -n $CONTAINER_APP_NAME -g $RESOURCE_GROUP --revision "$REVISION_NAME" --type system --tail 100 || true
