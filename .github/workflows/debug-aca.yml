name: Debug ACA Revisions
on: [workflow_dispatch]
permissions:
  id-token: write
  contents: read
env:
  RESOURCE_GROUP: rg-wealthspot-prod
  CONTAINER_APP_NAME: wealthspot-api
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Show Revision Errors
        run: |
          # Get all failed or degraded revisions
          FAILED_REVISIONS=$(az containerapp revision list -n $CONTAINER_APP_NAME -g $RESOURCE_GROUP --query "[?properties.runningState=='Failed' || properties.runningState=='Degraded' || properties.runningState=='Unknown'].name" -o tsv)
          
          for REV in $FAILED_REVISIONS; do
            echo "============================================="
            echo "Console Logs for $REV:"
            az containerapp logs show -n $CONTAINER_APP_NAME -g $RESOURCE_GROUP --revision "$REV" --type console --tail 100 || true
            echo "============================================="
          done
