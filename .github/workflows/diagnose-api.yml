name: Diagnose API Container

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-wealthspot-prod
  CONTAINER_APP_NAME: wealthspot-api

jobs:
  diagnose:
    name: Get Container Logs and State
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: List revisions
        run: |
          echo "=== Revision List ==="
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name,active:properties.active,state:properties.runningState,health:properties.healthState,details:properties.runningStateDetails}" \
            --output table

      - name: Get latest revision logs
        run: |
          echo "=== Latest Revision ==="
          LATEST=$(az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "sort_by([], &properties.createdTime)[-1].name" \
            -o tsv)
          echo "Latest revision: $LATEST"

          echo "=== Container Logs (last 100 lines) ==="
          az containerapp logs show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$LATEST" \
            --tail 100 \
            --follow false \
            2>&1 || echo "Could not fetch logs"

      - name: Describe revision
        run: |
          LATEST=$(az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "sort_by([], &properties.createdTime)[-1].name" \
            -o tsv)
          echo "=== Revision Details ==="
          az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$LATEST" \
            --query "properties" \
            --output json
