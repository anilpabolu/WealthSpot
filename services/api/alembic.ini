# Alembic configuration for WealthSpot

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://neondb_owner:npg_zkZ0mBY8PTJj@ep-mute-term-aoch1ce0.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
; sqlalchemy.url = postgresql://neondb_owner:npg_zkZ0mBY8PTJj@ep-mute-term-aoch1ce0.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
